name: Build Nomi Windows installer
on:
  push:
    branches:
      - nomi/windows-mvp
  pull_request:
    paths:
      - nomi-src.tar.xz
      - .github/workflows/nomi-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Unpack Nomi source
        shell: pwsh
        run: |
          tar -xf nomi-src.tar.xz
          if (!(Test-Path 'nomi-desktop/package.json')) { throw 'Missing Nomi source files' }
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: nomi-desktop
        run: npm install --no-audit --no-fund
      - name: Run Design QA tests
        working-directory: nomi-desktop
        run: npm test
      - name: Build Windows EXE installer
        working-directory: nomi-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Nomi Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nomi-windows-installer
          path: nomi-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30
