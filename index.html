@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{font-family:Vazirmatn,Tahoma,sans-serif;background:#0b1220;color:#eaf0f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#1c3a6155,transparent 45%),#0b1220;min-height:100vh}button,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#111d2e;border-left:1px solid #304058;padding:27px 14px}.brand{padding:10px 13px 25px;border-bottom:1px solid #324056;margin-bottom:18px}.brand strong{font-size:23px}.brand small{display:block;color:#8fa4bd;margin-top:4px}.nav{width:100%;text-align:right;border:0;background:transparent;color:#a5b6ce;border-radius:10px;padding:13px;margin:2px 0}.nav.active,.nav:hover{background:#294364;color:#fff}.main{padding:35px clamp(16px,4vw,54px);max-width:1500px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}h1{margin:0;font-size:26px}h2{font-size:18px;margin:0 0 16px}p{color:#a7b7cd;line-height:1.9}small,.muted{color:#97abc4}.pill{border:1px solid #3a526d;padding:6px 12px;border-radius:30px;color:#aec7e2;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#172337;border:1px solid #30415a;border-radius:16px;padding:20px;min-width:0}.label{font-size:12px;color:#a4b6cf}.number{font-size:29px;font-weight:800;margin-top:10px}.section{margin-top:24px}.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.module{border:1px solid #33455d;background:#1b2a40;border-radius:12px;padding:18px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.bar{height:8px;border-radius:20px;background:#30445d;overflow:hidden;margin-top:16px}.fill{height:100%;background:linear-gradient(90deg,#2aafab,#60d7b6);border-radius:20px}.empty{border:1px dashed #425571;padding:25px;border-radius:12px;color:#9cafc8;text-align:center;line-height:2}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px}th,td{padding:15px;text-align:right;border-bottom:1px solid #314259;font-size:12px}th{color:#9eb4cc}tr:last-child td{border:0}.switch{border:1px solid #3a5473;background:#1b304b;border-radius:10px;color:#bed5ec;padding:9px 14px;margin:4px}.switch.active{background:#315d88;color:white}.release{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px}.release select{background:#14243a;color:#eff5fc;border:1px solid #43607e;border-radius:9px;padding:10px;min-width:170px}.bug{padding:14px 0;border-bottom:1px solid #304058;display:flex;gap:12px;align-items:flex-start}.bug input{width:18px;height:18px;accent-color:#45c9a4;cursor:not-allowed}.bug.done .bugtitle{text-decoration:line-through;color:#849aaf}.bugmeta{color:#93abc5;font-size:11px;margin-top:5px}.notice{background:#17304a;border:1px solid #315779;color:#b7d4ef;padding:14px 18px;border-radius:11px;margin:16px 0}.footer{margin-top:40px;color:#8197b3;font-size:11px}a{color:#a8d0ff}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{padding:14px;position:static}.brand{padding:4px 8px 14px;margin-bottom:8px}.navbox{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:9px 11px}.main{padding:22px 16px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.module-grid{grid-template-columns:1fr}.cards{gap:9px}.card{padding:14px}h1{font-size:21px}}
 .nav-symbol{display:inline-flex;align-items:center;justify-content:center;width:23px;margin-left:9px;color:#63c6d8;font-size:18px}.nav.active{box-shadow:inset -3px 0 0 #56c5d8}.module-select{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}.module-detail{margin-top:16px}.cards.compact{grid-template-columns:repeat(4,minmax(0,1fr))}.cards.compact .number{font-size:23px}@media(max-width:700px){.cards.compact{grid-template-columns:repeat(2,minmax(0,1fr))}} 
/* Light theme and improved module navigation */
:root{color-scheme:light;background:#f4f7fb;color:#193049}
body{background:linear-gradient(145deg,#eef5ff,#f8fafc 45%,#f2f6fc);color:#193049}
.side{background:#fff;border-left:1px solid #e1e8f1;box-shadow:-2px 0 18px #203c5c08}
.brand{border-bottom-color:#e6ebf2}.brand small,.muted,small{color:#657d98}
.nav{color:#405b78;font-weight:600}.nav:hover{background:#edf4fb;color:#124b7d}.nav.active{background:#e3effb;color:#135288;box-shadow:inset -3px 0 0 #1782b9}
.nav-symbol{color:#1683b7}.card{background:#fff;border-color:#e1e8f1;box-shadow:0 6px 24px #2a48640a}

.release select{background:#fff;color:#213e59;border-color:#cbdced}.bug{border-bottom-color:#e7edf4}.bug.done .bugtitle{color:#8ba0b2}.bugmeta{color:#6d849d}.notice{background:#e9f4fe;border-color:#d3e7f9;color:#315c80}.footer{color:#71869e}

</style></head><body><div class="layout"><aside class="side"><div class="brand"><strong>تکنوهاب</strong><small>TechnoHub • Project Control</small></div><nav class="navbox" id="nav" aria-label="بخش‌های داشبورد"></nav></aside><main class="main"><header><div><h1 id="heading">داشبورد مدیریتی</h1><small>مرکز گزارش وضعیت توسعه نرم‌افزار</small></div><span class="pill">فقط نمایش</span></header><div id="view"></div><footer class="footer">TechnoHub PMO • اطلاعات از فایل JSON مخزن خوانده می‌شود • ویرایش فقط از طریق GitHub</footer></main></div>
<script>
const sections=[["overview","داشبورد اصلی","◫"],["modules","ماژول‌ها","▦"],["structure","ساختار پروژه","☷"],["tasks","فعالیت‌ها و پیشرفت","☑"],["schedule","زمان‌بندی","▤"],["releases","نسخه‌ها و باگ‌ها","⚑"],["risks","ریسک‌ها و موانع","⚠"],["reports","گزارش‌ها","▣"]];
let data={},page=location.hash==="#modules"?"modules":"overview",releaseId="",moduleId="customer";
const safe=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=x=>x===null||x===undefined||x===""?"ثبت نشده":safe(x);
const box=(content,more="")=>'<section class="card '+more+'">'+content+'</section>';
const empty=(label="هنوز اطلاعاتی ثبت نشده است.")=>'<div class="empty">'+safe(label)+'</div>';
const table=(cols,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty();
function modules(){return '<div class="module-grid">'+(data.modules||[]).map(m=>'<div class="module"><div class="between"><b>'+safe(m.name)+'</b><span class="pill">اجرا: '+(m.progress==null?'ثبت نشده':safe(m.progress)+'٪')+'</span></div><div class="label" style="margin-top:14px">پیشرفت اجرا</div><div class="bar"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(m.progress)||0))+'%"></div></div><div class="between" style="margin-top:18px"><span class="label">پیشرفت تست</span><span class="pill">'+(m.testProgress==null?'ثبت نشده':safe(m.testProgress)+'٪')+'</span></div><div class="bar"><div class="fill" style="width:'+Math.max(0,Math.min(100,Number(m.testProgress)||0))+'%;background:linear-gradient(90deg,#6383e8,#a2baff)"></div></div><p>'+safe(m.status||"ثبت نشده")+'</p></div>').join('')+'</div>'}
function row(cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
function render(){document.getElementById('nav').innerHTML=sections.map(s=>'<button class="nav '+(s[0]===page?'active':'')+'" data-page="'+s[0]+'"><span class="nav-symbol">'+s[2]+'</span>'+s[1]+'</button>').join('');document.getElementById("heading").textContent=sections.find(s=>s[0]===page)[1];let h="";
if(page==="overview"){const mods=data.modules||[];const nums=mods.map(m=>m.progress).filter(x=>typeof x==="number");const pct=nums.length===mods.length&&mods.length?Math.round(nums.reduce((a,b)=>a+b,0)/nums.length)+"٪":"ثبت نشده";const bugs=data.bugs||[];h='<div class="cards">'+[["پیشرفت چهار ماژول",pct],["فعالیت‌های باز",(data.tasks||[]).filter(x=>x.status!=="done").length],["باگ‌های باز",bugs.filter(x=>!x.done).length],["نسخه‌های ثبت شده",(data.releases||[]).length]].map(k=>box('<div class="label">'+k[0]+'</div><div class="number">'+k[1]+'</div>')).join('')+'</div><div class="section">'+box('<h2>وضعیت ماژول‌های پروژه</h2>'+modules())+'</div><div class="section">'+box('<h2>خلاصه آخرین گزارش</h2>'+((data.reports||[]).length?'<p>'+safe(data.reports[data.reports.length-1].summary||"گزارش ثبت‌شده")+'</p>':empty('گزارش مدیریتی هنوز ثبت نشده است.')))+'</div><div class="notice">درصد کل پروژه تا زمان ثبت وزن‌ها و پیشرفت‌های واقعی، قابل محاسبه نیست. کارت‌ها بر اساس داده‌های واردشده نمایش داده می‌شوند.</div>'}
if(page==="modules"){const mods=data.modules||[];if(!mods.some(m=>m.id===moduleId))moduleId=mods[0]?.id||"";const m=mods.find(x=>x.id===moduleId);h=box('<h2>جزئیات چهار ماژول</h2><div class="module-select">'+mods.map(x=>'<button class="switch '+(x.id===moduleId?'active':'')+'" data-module="'+safe(x.id)+'">'+safe(x.name)+'</button>').join('')+'</div>'+(m?'<div class="module-detail"><h2>'+safe(m.name)+'</h2><div class="cards compact"><div class="card"><div class="label">درصد اجرا</div><div class="number">'+(m.progress==null?'—':safe(m.progress)+'٪')+'</div></div><div class="card"><div class="label">درصد تست</div><div class="number">'+(m.testProgress==null?'—':safe(m.testProgress)+'٪')+'</div></div><div class="card"><div class="label">فعالیت‌های ثبت‌شده</div><div class="number">'+(data.tasks||[]).filter(t=>t.module===m.name||t.module===m.id).length+'</div></div><div class="card"><div class="label">موارد فنی باز</div><div class="number">'+(data.bugs||[]).filter(b=>!b.done&&b.module===m.name).length+'</div></div></div><div class="section"><h2>فعالیت‌های ماژول</h2>'+table(["عنوان","پیشرفت","وضعیت"],(data.tasks||[]).filter(t=>t.module===m.name||t.module===m.id).map(t=>row([val(t.title),t.progress==null?"ثبت نشده":safe(t.progress)+"٪",val(t.status)])))+'</div>':'')+'</div>')}
if(page==="structure"){h=box('<h2>چهار ماژول نرم‌افزاری</h2>'+modules())+'<div class="section">'+box('<h2>ساختار شکست کار (WBS)</h2>'+table(["کد","عنوان","ماژول","وضعیت"],(data.wbs||[]).map(x=>row([val(x.code),val(x.title),val(x.module),val(x.status)]))))+'</div>'}
if(page==="tasks"){h=box('<h2>فهرست فعالیت‌ها</h2>'+table(["فعالیت","ماژول","پیشرفت","وضعیت"],(data.tasks||[]).map(x=>row([val(x.title),val(x.module),x.progress==null?"ثبت نشده":safe(x.progress)+"٪",val(x.status)]))))}
if(page==="schedule"){h=box('<h2>نقاط عطف و زمان‌بندی</h2>'+table(["عنوان","ماژول","تاریخ هدف","وضعیت"],(data.milestones||[]).map(x=>row([val(x.title),val(x.module),val(x.dueDate),val(x.status)]))))}
if(page==="risks"){h=box('<h2>ریسک‌ها و موانع</h2>'+table(["موضوع","نوع","وضعیت","اقدام"],(data.risks||[]).map(x=>row([val(x.title),val(x.type),val(x.status),val(x.action)]))))}
if(page==="reports"){h=box('<h2>گزارش‌های مدیریتی</h2>'+(data.reports||[]).map(r=>'<div class="module"><b>'+val(r.title)+'</b><small style="margin-right:12px">'+val(r.date)+'</small><p>'+val(r.summary)+'</p></div>').join('')+(data.reports||[]).length?'':"");if(!(data.reports||[]).length)h=box('<h2>گزارش‌های مدیریتی</h2>'+empty())}
if(page==="releases"){let releases=data.releases||[],bugs=data.bugs||[],questions=data.questions||[];if(!releaseId||!releases.some(r=>r.id===releaseId))releaseId=releases[0]?.id||"";const selected=bugs.filter(b=>b.releaseId===releaseId),asked=questions.filter(q=>q.releaseId===releaseId),done=selected.filter(b=>b.done).length;const groups=[...new Set(selected.map(b=>b.team||"سایر"))];h=box('<h2>گزارش باگ نسخه‌ها</h2>'+(releases.length?'<div class="release"><label for="release">نسخه:</label><select id="release">'+releases.map(r=>'<option value="'+safe(r.id)+'" '+(r.id===releaseId?'selected':'')+'>'+safe(r.version)+'</option>').join('')+'</select><span class="pill">'+done+' از '+selected.length+' انجام‌شده</span><span class="pill">'+asked.length+' ابهام</span></div>'+(selected.length?groups.map(g=>'<h3 style="margin-top:26px;color:#bed8f5">'+safe(g)+'</h3>'+selected.filter(b=>(b.team||"سایر")===g).map(b=>'<div class="bug '+(b.done?'done':'')+'"><input type="checkbox" '+(b.done?'checked':'')+' disabled title="وضعیت فقط در ChatGPT تغییر می‌کند"><div><div class="bugtitle"><small>'+safe(b.id)+' </small>'+safe(b.title)+'</div><p style="font-size:12px;margin:4px 0">'+safe(b.description||"")+'</p><div class="bugmeta">'+val(b.module)+' • '+(b.done?'انجام شده':'باز')+'</div></div></div>').join('')).join(''):empty("برای این نسخه موردی ثبت نشده است.")) : empty("هنوز نسخه‌ای ثبت نشده است."))+'<p class="muted">تیک‌ها فقط برای نمایش هستند؛ برای تغییر وضعیت هر مورد در همین گفتگو به من بگو.</p>')+(asked.length?'<div class="section">'+box('<h2>سؤالات و ابهامات ('+asked.length+')</h2>'+asked.map(q=>'<div class="bug"><div><b>'+safe(q.id)+'</b> — '+safe(q.title)+'<div class="bugmeta">'+safe(q.team)+' • '+safe(q.status)+'</div></div></div>').join(''))+'</div>':"")}
document.getElementById("view").innerHTML=h;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;history.replaceState(null,"",page==="modules"?"#modules":location.pathname+location.search);render()});document.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>{moduleId=b.dataset.module;render()});const select=document.getElementById("release");if(select)select.onchange=e=>{releaseId=e.target.value;render()}}
fetch("./data/project.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("دریافت داده ناموفق بود");return r.json()}).then(d=>{data=d;render()}).catch(e=>{document.getElementById("view").innerHTML=box('<h2>خطا در دریافت اطلاعات</h2><p>'+safe(e.message)+'</p>')});render();
</script></body></html>
