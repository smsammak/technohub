#view .bug input[type="checkbox"]:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg)}

.bug-team-heading{color:#17243b!important;font-size:19px!important;font-weight:800!important;margin:32px 0 16px!important}
.bug-tile{background:#fff;border:1px solid #e2e7f0;border-radius:18px;padding:21px 23px;margin:0 0 14px;box-shadow:0 3px 12px #14264408;text-align:right}
.bug-tile.is-completed{border-right:4px solid #1ca56b}
.bug-tile-header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}
.bug-heading{display:flex;gap:13px;align-items:center;min-width:0}
.bug-checkbox{width:25px;height:25px;flex:none;border:2px solid #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;background:white;color:white;font-weight:900}
.bug-checkbox.checked{border-color:#1c9b66;background:#1c9b66}
.bug-code{font-size:12px;color:#647da0;direction:ltr;text-align:right;font-weight:700}
.bug-tile-title{font-size:17px;line-height:1.8;color:#13233e;font-weight:800}
.bug-status{flex:none;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;background:#eff4fb;color:#556b85}
.bug-status.status-done{background:#e7f8ed;color:#187d50}
.bug-status.status-open{background:#fff1e8;color:#ac631a}
.bug-status.status-in_progress{background:#e8f1ff;color:#2959c2}
.bug-status.status-blocked{background:#ffe9eb;color:#c34651}
.bug-status.status-review{background:#f0ebff;color:#7051bb}
.bug-tile-description{color:#536579;font-size:13px;line-height:2;margin:12px 0}
.bug-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}
.bug-module-tag,.bug-team-tag{border-radius:8px;padding:5px 10px;font-size:11px;background:#f2f6fa;color:#4b6383;font-weight:600}
.bug-team-tag{background:#f0f0fd;color:#62639e}
.bug-details-grid{display:grid;grid-template-columns:175px minmax(0,1fr);gap:12px}
.bug-detail{background:#f8fafd;border:1px solid #e8edf5;padding:12px 14px;border-radius:12px;min-width:0}
.bug-detail-label{display:block;color:#77889d;font-size:11px;margin-bottom:5px}
.bug-detail strong{display:block;color:#293c54;font-size:12px;line-height:1.9;overflow-wrap:anywhere}
@media(max-width:620px){.bug-tile{padding:16px}.bug-details-grid{grid-template-columns:1fr}.bug-tile-header{gap:8px}.bug-tile-title{font-size:15px}}
.module-phase-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.module-phase-box{border:1px solid #e2e8f0;border-radius:13px;background:#f8fafc;padding:12px;min-width:0;text-align:right}.module-phase-box.complete{background:#edf6ff;border-color:#bad5f7}.module-phase-box.partial{background:#fff9ed;border-color:#f5d7a8}.module-phase-name{font-size:12px;line-height:1.8;font-weight:800;color:#293b55}.module-phase-score{font-size:12px;color:#65778f;margin:5px 0 8px}.module-phase-box.complete .module-phase-score{color:#2165bb;font-weight:800}.module-phase-track{height:5px;border-radius:10px;background:#e4eaf2;overflow:hidden}.module-phase-track>div{height:100%;border-radius:10px;background:#3969e8}.module-wide{min-height:0}.module-meta{margin-top:4px}</style></head><body><div class="layout"><main class="main"><div class="dashboard-shell"><header class="tophead"><div class="brand-logo"><strong>TECHNOHUB</strong><small>PROJECT WORKSPACE</small></div><div class="header-section"><strong>داشبورد مدیریت پروژه</strong><small>نمای زنده اطلاعات ثبت‌شده تکنوهاب</small></div><span class="pill">● فقط‌خواندنی</span></header><nav class="navbox" id="nav" aria-label="بخش‌های داشبورد"></nav><div class="pagehead"><h2 id="heading">داشبورد اصلی</h2><span class="muted">گزارش وضعیت پروژه</span></div><div id="view"></div></div><footer class="footer">TechnoHub PMO • اطلاعات از فایل JSON مخزن خوانده می‌شود • ویرایش فقط از طریق GitHub</footer></main></div>
<script>
const sections=[["overview","داشبورد اصلی","◫"],["modules","ماژول‌ها","▦"],["structure","ساختار پروژه","☷"],["tasks","فعالیت‌ها و پیشرفت","☑"],["schedule","زمان‌بندی","▤"],["releases","نسخه‌ها و باگ‌ها","⚑"],["risks","ریسک‌ها و موانع","⚠"],["reports","گزارش‌ها","▣"]];
let data={},page=location.hash==="#modules"?"modules":"overview",releaseId="",moduleId="customer";
const safe=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val=x=>x===null||x===undefined||x===""?"ثبت نشده":safe(x);
const box=(content,more="")=>'<section class="card '+more+'">'+content+'</section>';
const empty=(label="هنوز اطلاعاتی ثبت نشده است.")=>'<div class="empty">'+safe(label)+'</div>';
const table=(cols,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':empty();
function modulePhaseData(m){const defs=[["implementation","پیاده‌سازی"],["processImplementation","پیاده‌سازی فرایند"],["testing","تست"],["delivery","تحویل"]];const p=m.phases||{};return defs.map(([key,title])=>({title,value:typeof p[key]==="number"?Math.max(0,Math.min(100,p[key])):null}));}
function modulePhaseTotal(m){const a=modulePhaseData(m);return a.every(x=>x.value!==null)?a.reduce((n,x)=>n+x.value*.25,0):null;}
function modulePhaseBoxes(m){return '<div class="module-phase-grid">'+modulePhaseData(m).map(x=>'<div class="module-phase-box '+(x.value===100?'complete':x.value!==null&&x.value>0?'partial':'')+'"><div class="module-phase-name">'+x.title+'</div><div class="module-phase-score">'+(x.value===null?'ثبت نشده':x.value===100?'۲۵٪ سهم تکمیل':'پیشرفت '+safe(x.value)+'٪')+'</div><div class="module-phase-track"><div style="width:'+(x.value||0)+'%"></div></div></div>').join('')+'</div>';}
function modules(){return '<div class="module-grid">'+(data.modules||[]).map(m=>'<div class="module"><div class="between"><b>'+safe(m.name)+'</b><span class="pill">مراحل: '+(modulePhaseTotal(m)===null?'ثبت نشده':modulePhaseTotal(m)+'٪')+'</span></div>'+modulePhaseBoxes(m)+'<p>اجرای قبلی: '+(m.progress==null?'ثبت نشده':safe(m.progress)+'٪')+'</p></div>').join('')+'</div>'}
function row(cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
function render(){document.getElementById('nav').innerHTML=sections.map(s=>'<button class="nav '+(s[0]===page?'active':'')+'" data-page="'+s[0]+'"><span class="nav-symbol">'+s[2]+'</span>'+s[1]+'</button>').join('');document.getElementById("heading").textContent=sections.find(s=>s[0]===page)[1];let h="";
if(page==="overview"){const mods=data.modules||[];const nums=mods.map(m=>m.progress).filter(x=>typeof x==="number");const pct=mods.length&&nums.length===mods.length?Math.round(nums.reduce((a,b)=>a+b,0)/mods.length)+"٪":"ثبت نشده";const bugs=data.bugs||[];const open=bugs.filter(x=>!x.done).length;const fixed=bugs.length-open;const qs=data.questions||[];const releases=data.releases||[];h='<div class="overview-toolbar"><b>نمای کلی تکنوهاب</b><span class="pill">آخرین اطلاعات ثبت‌شده</span></div><div class="overview-stats">'+[["پیشرفت اجرای پروژه",pct,"میانگین تنها در صورت ثبت هر چهار ماژول"],["پیشرفت تست","ثبت نشده","درصد تست همه ماژول‌ها هنوز ثبت نشده"],["باگ‌های باز",String(open),"از "+bugs.length+" مورد ثبت‌شده"],["نسخه‌های ثبت‌شده",String(releases.length),"چک‌لیست نسخه‌ها"]].map(k=>'<div class="stat-simple"><div class="label">'+k[0]+'</div><div class="stat-value">'+k[1]+'</div><div class="stat-foot">'+k[2]+'</div></div>').join('')+'</div><div class="nw-main-grid"><section class="nw-panel"><h2>وضعیت ماژول‌ها</h2><div class="module-stack">'+mods.map(m=>{const p=m.progress==null?null:Number(m.progress),tp=m.testProgress==null?null:Number(m.testProgress),issues=bugs.filter(b=>!b.done&&b.module===m.name).length;return '<button class="module-wide" data-open-module="'+safe(m.id)+'"><div class="between"><b>'+safe(m.name)+'</b><span class="module-percent">'+(p===null?"ثبت نشده":safe(p)+"٪")+' <span class="chevron">‹</span></span></div>'+modulePhaseBoxes(m)+'<div class="between module-meta"><span>اجرای ثبت‌شده: '+(m.progress==null?'ثبت نشده':safe(m.progress)+'٪')+'</span><span>'+issues+' مورد باز</span></div></button>'}).join('')+'</div></section><div class="nw-side-stack"><section class="nw-panel"><h2>وضعیت نسخه‌ها و پیگیری‌ها</h2><div class="nw-summary-grid"><div class="nw-summary-item"><strong>'+fixed+' / '+bugs.length+'</strong><span>باگ‌های انجام‌شده</span></div><div class="nw-summary-item"><strong>'+qs.length+'</strong><span>سؤالات و ابهامات</span></div></div><div style="margin-top:15px">'+(releases.length?releases.map(r=>'<div class="module-meta" style="padding:9px 0;border-bottom:1px solid #e8edf2"><strong>'+safe(r.version)+'</strong><span>'+bugs.filter(b=>b.releaseId===r.id&&!b.done).length+' باگ باز</span></div>').join(''):empty("نسخه ثبت نشده است."))+'</div></section><section class="nw-panel"><h2>خلاصه آخرین گزارش</h2>'+((data.reports||[]).length?'<p>'+safe(data.reports[data.reports.length-1].summary||"گزارش ثبت‌شده")+'</p>':empty("گزارش مدیریتی هنوز ثبت نشده است."))+'</section></div></div>'}
if(page==="modules"){const mods=data.modules||[];if(!mods.some(m=>m.id===moduleId))moduleId=mods[0]?.id||"";const m=mods.find(x=>x.id===moduleId);h=box('<h2>جزئیات چهار ماژول</h2><div class="module-select">'+mods.map(x=>'<button class="switch '+(x.id===moduleId?'active':'')+'" data-module="'+safe(x.id)+'">'+safe(x.name)+'</button>').join('')+'</div>'+(m?'<div class="module-detail"><h2>'+safe(m.name)+'</h2><div class="cards compact"><div class="card"><div class="label">درصد اجرا</div><div class="number">'+(m.progress==null?'—':safe(m.progress)+'٪')+'</div></div><div class="card"><div class="label">درصد تست</div><div class="number">'+(m.testProgress==null?'—':safe(m.testProgress)+'٪')+'</div></div><div class="card"><div class="label">فعالیت‌های ثبت‌شده</div><div class="number">'+(data.tasks||[]).filter(t=>t.module===m.name||t.module===m.id).length+'</div></div><div class="card"><div class="label">موارد فنی باز</div><div class="number">'+(data.bugs||[]).filter(b=>!b.done&&b.module===m.name).length+'</div></div></div><div class="section"><h2>فعالیت‌های ماژول</h2>'+table(["عنوان","پیشرفت","وضعیت"],(data.tasks||[]).filter(t=>t.module===m.name||t.module===m.id).map(t=>row([val(t.title),t.progress==null?"ثبت نشده":safe(t.progress)+"٪",val(t.status)])))+'</div>':'')+'</div>')}
if(page==="structure"){h=box('<h2>چهار ماژول نرم‌افزاری</h2>'+modules())+'<div class="section">'+box('<h2>ساختار شکست کار (WBS)</h2>'+table(["کد","عنوان","ماژول","وضعیت"],(data.wbs||[]).map(x=>row([val(x.code),val(x.title),val(x.module),val(x.status)]))))+'</div>'}
if(page==="tasks"){h=box('<h2>فهرست فعالیت‌ها</h2>'+table(["فعالیت","ماژول","پیشرفت","وضعیت"],(data.tasks||[]).map(x=>row([val(x.title),val(x.module),x.progress==null?"ثبت نشده":safe(x.progress)+"٪",val(x.status)]))))}
if(page==="schedule"){h=box('<h2>نقاط عطف و زمان‌بندی</h2>'+table(["عنوان","ماژول","تاریخ هدف","وضعیت"],(data.milestones||[]).map(x=>row([val(x.title),val(x.module),val(x.dueDate),val(x.status)]))))}
if(page==="risks"){h=box('<h2>ریسک‌ها و موانع</h2>'+table(["موضوع","نوع","وضعیت","اقدام"],(data.risks||[]).map(x=>row([val(x.title),val(x.type),val(x.status),val(x.action)]))))}
if(page==="reports"){h=box('<h2>گزارش‌های مدیریتی</h2>'+(data.reports||[]).map(r=>'<div class="module"><b>'+val(r.title)+'</b><small style="margin-right:12px">'+val(r.date)+'</small><p>'+val(r.summary)+'</p></div>').join('')+(data.reports||[]).length?'':"");if(!(data.reports||[]).length)h=box('<h2>گزارش‌های مدیریتی</h2>'+empty())}
if(page==="releases"){let releases=data.releases||[],bugs=data.bugs||[],questions=data.questions||[];if(!releaseId||!releases.some(r=>r.id===releaseId))releaseId=releases[0]?.id||"";const selected=bugs.filter(b=>b.releaseId===releaseId),asked=questions.filter(q=>q.releaseId===releaseId),done=selected.filter(b=>b.done).length;const groups=[...new Set(selected.map(b=>b.team||"سایر"))];h=box('<h2>گزارش باگ نسخه‌ها</h2>'+(releases.length?'<div class="release"><label for="release">نسخه:</label><select id="release">'+releases.map(r=>'<option value="'+safe(r.id)+'" '+(r.id===releaseId?'selected':'')+'>'+safe(r.version)+'</option>').join('')+'</select><span class="pill">'+done+' از '+selected.length+' انجام‌شده</span></div><div class="release-stats"><div class="release-stat"><div class="label">باگ‌های نسخه</div><div class="release-stat-value">'+done+' <small>از '+selected.length+' رفع‌شده</small></div><div class="release-stat-sub">'+(selected.length-done)+' مورد باقی‌مانده</div></div><div class="release-stat"><div class="label">سؤالات و ابهامات</div><div class="release-stat-value">'+asked.length+'</div><div class="release-stat-sub">موارد نیازمند پیگیری</div></div></div>'+(selected.length?groups.map(g=>'<h3 class="bug-team-heading">'+safe(g)+'</h3>'+selected.filter(b=>(b.team||"سایر")===g).map(b=>'<article class="bug-tile '+(b.done?'is-completed':'')+'"><div class="bug-tile-header"><div class="bug-heading"><span class="bug-checkbox '+(b.done?'checked':'')+'">'+(b.done?'✓':'')+'</span><div class="bug-heading-copy"><div class="bug-code">'+safe(b.id)+'</div><div class="bug-tile-title">'+safe(b.title)+'</div></div></div><span class="bug-status status-'+safe(b.status|| (b.done?'done':'open'))+'">'+({done:'انجام‌شده',open:'باز',in_progress:'در حال انجام',blocked:'مسدود',review:'نیازمند بررسی'}[b.status||(b.done?'done':'open')]||'باز')+'</span></div><p class="bug-tile-description">'+safe(b.description||'')+'</p><div class="bug-tags"><span class="bug-module-tag">'+val(b.module)+'</span><span class="bug-team-tag">'+safe(b.team||'')+'</span></div><div class="bug-details-grid"><div class="bug-detail"><span class="bug-detail-label">تاریخ انجام</span><strong>'+ (b.completedDate?safe(b.completedDate):'ثبت نشده')+'</strong></div><div class="bug-detail"><span class="bug-detail-label">توضیحات پیگیری / رفع</span><strong>'+(b.resolutionNotes?safe(b.resolutionNotes):'هنوز توضیحی ثبت نشده است')+'</strong></div></div></article>').join('')).join(''):empty("برای این نسخه موردی ثبت نشده است.")) : empty("هنوز نسخه‌ای ثبت نشده است."))+'<p class="muted">تیک‌ها فقط برای نمایش هستند؛ برای تغییر وضعیت هر مورد در همین گفتگو به من بگو.</p>')+(asked.length?'<div class="section">'+box('<h2>سؤالات و ابهامات ('+asked.length+')</h2>'+asked.map(q=>'<div class="bug"><div><b>'+safe(q.id)+'</b> — '+safe(q.title)+'<div class="bugmeta">'+safe(q.team)+' • '+safe(q.status)+'</div></div></div>').join(''))+'</div>':"")}
document.getElementById("view").innerHTML=h;document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;history.replaceState(null,"",page==="modules"?"#modules":location.pathname+location.search);render()});document.querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>{moduleId=b.dataset.module;render()});document.querySelectorAll("[data-open-module]").forEach(b=>b.onclick=()=>{moduleId=b.dataset.openModule;page="modules";history.replaceState(null,"","#modules");render()});const select=document.getElementById("release");if(select)select.onchange=e=>{releaseId=e.target.value;render()}}
fetch("./data/project.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("دریافت داده ناموفق بود");return r.json()}).then(d=>{data=d;render()}).catch(e=>{document.getElementById("view").innerHTML=box('<h2>خطا در دریافت اطلاعات</h2><p>'+safe(e.message)+'</p>')});render();
</script></body></html>
